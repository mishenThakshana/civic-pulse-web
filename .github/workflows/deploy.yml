name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/mishenthakshana/civic-pulse-app
  WEB_IMAGE: ghcr.io/mishenthakshana/civic-pulse-web-nginx
  AI_IMAGE: ghcr.io/mishenthakshana/civic-pulse-ai

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: civic_pulse_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip, pcntl
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1

      - name: Run tests
        run: php artisan test --compact
        env:
          DB_HOST: 127.0.0.1

  test-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements*.txt

      - name: Install dependencies (CPU torch)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-push:
    needs: [test, test-ai]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app (php-fpm) image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web (nginx) image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ai
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:latest
            ${{ env.AI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Two pushes in quick succession used to deploy at the same time and
    # collide on container recreation ("removal of container … is already in
    # progress"). Queue deploys instead; never cancel one mid-migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GEMINI_API_KEY
          script: |
            set -e
            cd /srv/civicpulse
            git fetch origin main
            git reset --hard origin/main
            # ai/.env is gitignored, so it survives the reset; rewrite it from
            # the repo secret so a rotated key is picked up on the next deploy.
            umask 077
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > ai/.env
            # Trained models (git-ignored) are copied to ai/models by hand. Enable
            # each one only if its files are present, so a missing model just
            # reports model_not_loaded instead of breaking the deploy.
            if [ -f ai/models/image/image_classifier.pt ]; then
              echo 'IMAGE_MODEL_PATH=models/image/image_classifier.pt' >> ai/.env
            fi
            if [ -f ai/models/text_category/model.safetensors ]; then
              echo 'TEXT_MODEL_NAME=/app/models/text_category' >> ai/.env
            fi
            if [ -f ai/models/spam/spam_model.joblib ]; then
              echo 'SPAM_MODEL_PATH=models/spam/spam_model.joblib' >> ai/.env
            fi
            # GHCR downloads of the large AI image layers occasionally drop
            # mid-transfer ("connection reset by peer"). Retry with backoff —
            # layers that finished are cached, so each attempt resumes. --quiet
            # keeps per-layer progress spam out of the Actions log.
            for i in 1 2 3 4 5; do
              docker compose pull --quiet && break
              [ "$i" = 5 ] && { echo "docker compose pull failed after $i attempts"; exit 1; }
              echo "docker compose pull failed (attempt $i/5), retrying in $((i * 15))s…"
              sleep $((i * 15))
            done
            docker compose up -d
            docker compose exec -T app php artisan migrate --force
            # Fail the deploy loudly if the AI screening service doesn't come up —
            # without it every new report is refused.
            for i in $(seq 1 30); do
              docker compose exec -T app php -r 'exit(@file_get_contents("http://ai:8000/api/v1/health") ? 0 : 1);' && break
              [ "$i" = 30 ] && { docker compose logs --tail=50 ai; exit 1; }
              sleep 3
            done
            docker image prune -f
