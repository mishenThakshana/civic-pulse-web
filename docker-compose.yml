services:
  app:
    build:
      context: .
      target: app
    image: ghcr.io/mishenthakshana/civic-pulse-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      CIVIC_AI_URL: http://ai:8000
    volumes:
      - storage-data:/var/www/html/storage
    networks: [civicpulse]
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  web:
    build:
      context: .
      target: web
    image: ghcr.io/mishenthakshana/civic-pulse-web-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - storage-data:/var/www/html/storage:ro
    networks: [civicpulse]
    depends_on:
      - app

  queue:
    image: ghcr.io/mishenthakshana/civic-pulse-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      CIVIC_AI_URL: http://ai:8000
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - storage-data:/var/www/html/storage
    networks: [civicpulse]
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: ghcr.io/mishenthakshana/civic-pulse-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      CIVIC_AI_URL: http://ai:8000
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage-data:/var/www/html/storage
    networks: [civicpulse]
    depends_on:
      db:
        condition: service_healthy

  # Report screening service (FastAPI). Internal only: Laravel calls it over the
  # compose network, it is never exposed on the host.
  ai:
    build:
      context: ai
    image: ghcr.io/mishenthakshana/civic-pulse-ai:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: ai/.env
        required: false
    environment:
      APP_ENV: production
    networks: [civicpulse]

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks: [civicpulse]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage-data:

networks:
  civicpulse:
    driver: bridge
