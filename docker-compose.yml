services:
  app:
    build:
      context: .
      target: app
    image: ghcr.io/mishenthakshana/civic-pulse-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - storage-data:/var/www/html/storage
    networks: [civicpulse]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: ghcr.io/mishenthakshana/civic-pulse-web-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - storage-data:/var/www/html/storage:ro
    networks: [civicpulse]
    depends_on:
      - app

  queue:
    image: ghcr.io/mishenthakshana/civic-pulse-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - storage-data:/var/www/html/storage
    networks: [civicpulse]
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: ghcr.io/mishenthakshana/civic-pulse-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage-data:/var/www/html/storage
    networks: [civicpulse]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks: [civicpulse]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage-data:

networks:
  civicpulse:
    driver: bridge
